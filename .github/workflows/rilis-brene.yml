# Workflow rilis untuk fork dlagia/BRENE.
#
# Upstream (rrr333nnn333/BRENE) membangun zip-nya manual, jadi fork ini tidak
# punya rilis sama sekali - padahal update.json + module.prop menunjuk ke
# rilis "latest" repo ini. Tanpa workflow ini tombol update di manager KernelSU
# akan 404 dan tidak ada zip yang bisa di-flash.
#
# Job "audit" sengaja dibuat gagal-keras supaya kesalahan yang pernah ditemukan
# saat audit tidak bisa masuk diam-diam lagi:
#   - update.json masih menunjuk repo upstream (fork ketimpa update upstream),
#   - versi module.prop dan update.json tidak sinkron,
#   - script modul rusak sintaksnya atau kena temuan shellcheck level error,
#   - toggle config_* dipakai script tapi tidak ada di config.sh (atau sebaliknya),
#   - tools/susfs bukan lagi ELF arm64.
name: Rilis BRENE

on:
  push:
    branches: [main]
    paths:
      - module/**
      - update.json
      - .github/workflows/rilis-brene.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    name: Audit modul
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sintaks + shellcheck semua script modul
        run: |
          set -eu
          for f in module/*.sh; do
            bash -n "$f" || { echo "ERROR: sintaks $f rusak"; exit 1; }
          done
          # Level error saja: SC2034 (variabel boilerplate tak terpakai) dan
          # SC1091 (source file lain) memang wajar di modul ini.
          shellcheck -s bash -S error module/*.sh

      - name: Versi module.prop harus sama dengan update.json
        run: |
          set -eu
          PROP_VER=$(grep -m1 '^version=' module/module.prop | cut -d= -f2)
          PROP_CODE=$(grep -m1 '^versionCode=' module/module.prop | cut -d= -f2)
          JSON_VER=$(jq -r '.version' update.json)
          JSON_CODE=$(jq -r '.versionCode' update.json)
          echo "module.prop : ${PROP_VER} (${PROP_CODE})"
          echo "update.json : ${JSON_VER} (${JSON_CODE})"
          [ "$PROP_VER" = "$JSON_VER" ] || { echo "ERROR: version tidak sinkron"; exit 1; }
          [ "$PROP_CODE" = "$JSON_CODE" ] || { echo "ERROR: versionCode tidak sinkron"; exit 1; }

      - name: URL update harus menunjuk fork ini, bukan upstream
        env:
          REPO: ${{ github.repository }}
        run: |
          set -eu
          grep -q "updateJson=https://raw.githubusercontent.com/${REPO}/" module/module.prop || {
            echo "ERROR: updateJson di module.prop tidak menunjuk ${REPO} -"
            echo "manager akan menawarkan rilis upstream dan menimpa fork ini."
            grep '^updateJson=' module/module.prop
            exit 1
          }
          jq -er --arg repo "$REPO" '.zipUrl | startswith("https://github.com/" + $repo + "/")' update.json > /dev/null || {
            echo "ERROR: zipUrl di update.json tidak menunjuk ${REPO}"
            jq -r '.zipUrl' update.json
            exit 1
          }

      - name: Toggle config_* harus konsisten
        run: |
          set -eu
          grep -oE '^config_[a-z0-9_]+' module/config.sh | sort -u > /tmp/defined.txt
          # Dua hal penting soal daftar "pemakai" di bawah:
          # - module/config.sh SENGAJA tidak ikut dipindai: kalau ikut, setiap toggle
          #   jadi "dipakai" oleh definisinya sendiri dan cek ORPHAN tidak akan pernah
          #   menyala (bug gerbang audit, ditemukan 2026-09-22).
          # - komentar dibuang dulu, karena komentar yang MEMBAHAS nama toggle (mis.
          #   mencatat toggle yang diganti nama upstream) bukan pemakaian.
          for f in module/action.sh module/boot-completed.sh module/customize.sh                    module/inotify.sh module/post-fs-data.sh module/uninstall.sh module/utils.sh; do
            sed 's/[[:space:]]*#.*$//' "$f"
          done > /tmp/pemakai.txt
          sed 's|[[:space:]]*//.*$||' module/webroot/script.js >> /tmp/pemakai.txt
          cat module/webroot/index.html >> /tmp/pemakai.txt
          grep -ohE 'config_[a-z0-9_]+' /tmp/pemakai.txt | sort -u > /tmp/used.txt
          if ! comm -13 /tmp/defined.txt /tmp/used.txt | grep -q .; then
            echo "OK: semua toggle yang dipakai ada di config.sh"
          else
            echo "ERROR: dipakai tapi tidak didefinisikan di config.sh:"
            comm -13 /tmp/defined.txt /tmp/used.txt
            exit 1
          fi
          ORPHAN=$(comm -23 /tmp/defined.txt /tmp/used.txt || true)
          [ -n "$ORPHAN" ] || echo "OK: tidak ada toggle yatim di config.sh"
          [ -z "$ORPHAN" ] || { echo "ERROR: toggle yatim (ada di config.sh, tidak dipakai siapa pun):"; echo "$ORPHAN"; exit 1; }

      - name: Setiap toggle harus punya switch di WebUI
        run: |
          set -eu
          # Tiga kunci ini bukan switch, melainkan text field dengan id sendiri
          # (vbh_text_field, custom_uname_release, custom_uname_version).
          BUKAN_SWITCH="config_spoof_verified_boot_hash config_custom_uname_kernel_release config_custom_uname_kernel_version"
          # while-read jalan di subshell, jadi status kegagalan dititipkan lewat file.
          rm -f /tmp/webui-gagal
          grep -oE '^config_[a-z0-9_]+' module/config.sh | while read -r key; do
            case " ${BUKAN_SWITCH} " in *" ${key} "*) continue ;; esac
            id=${key#config_}
            grep -q "id=\"${id}\"" module/webroot/index.html || {
              echo "ERROR: ${key} tidak punya elemen id=\"${id}\" di index.html"
              touch /tmp/webui-gagal
            }
            grep -q "id: '${id}'" module/webroot/script.js || {
              echo "ERROR: ${key} tidak ada di daftar configs di script.js"
              touch /tmp/webui-gagal
            }
          done
          [ ! -e /tmp/webui-gagal ] || exit 1
          echo "OK: semua toggle bisa diubah dari WebUI"

      - name: Sintaks JavaScript WebUI
        run: |
          set -eu
          # WebUI tidak pernah dijalankan di CI, jadi script.js yang rusak baru
          # ketahuan di perangkat. node --check menangkapnya di sini; ekstensi
          # .mjs dipakai supaya import/export ESM dikenali.
          for f in module/webroot/script.js module/webroot/assets/*.js; do
            base=$(basename "$f" .js)
            cp "$f" "/tmp/${base}.mjs"
            node --check "/tmp/${base}.mjs" || { echo "ERROR: sintaks $f rusak"; exit 1; }
          done
          echo "OK: script WebUI lolos node --check"

      - name: Binari susfs harus ELF arm64
        run: |
          set -eu
          file module/tools/susfs
          file module/tools/susfs | grep -q 'ELF 64-bit LSB .*ARM aarch64' || {
            echo "ERROR: module/tools/susfs bukan ELF arm64"; exit 1;
          }

  rilis:
    name: Bangun zip dan terbitkan rilis
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bangun BRENE.zip dari isi module/
        id: bangun
        run: |
          set -eu
          VERSION=$(grep -m1 '^version=' module/module.prop | cut -d= -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION}-dlagia.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          # module.prop WAJIB berada di akar zip, bukan di dalam folder module/.
          (cd module && zip -r9 ../BRENE.zip . -x '.*')
          cp BRENE.zip "BRENE-${VERSION}.zip"
          unzip -l BRENE.zip
          unzip -p BRENE.zip module.prop > /dev/null || { echo "ERROR: module.prop tidak di akar zip"; exit 1; }

      - name: Terbitkan rilis
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bangun.outputs.tag }}
          VERSION: ${{ steps.bangun.outputs.version }}
        run: |
          set -eu
          # Re-run job pakai GITHUB_RUN_NUMBER yang sama, jadi tag bisa sudah ada.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Rilis $TAG sudah ada, aset ditimpa."
            gh release upload "$TAG" --clobber "BRENE.zip" "BRENE-${VERSION}.zip"
            exit 0
          fi

          gh release create "$TAG" \
            --title "BRENE ${VERSION} (fork dlagia, build ${GITHUB_RUN_NUMBER})" \
            --notes "Dibangun otomatis dari ${GITHUB_SHA} di cabang \`main\`.

          Zip ini dipakai oleh \`update.json\` lewat tautan \`releases/latest/download/BRENE.zip\`,
          jadi tombol update di manager KernelSU mengambil dari fork ini, bukan dari upstream.

          Kernel yang diaudit untuk fork ini: rosemary 4.14 (dlagia/test), ReSukiSU version code 35158,
          SuSFS v2.3.0 NON-GKI, 9 fitur SuSFS aktif. Rinciannya di \`docs/AUDIT-KERNEL-DLAGIA.md\`." \
            --latest \
            "BRENE.zip" "BRENE-${VERSION}.zip"
